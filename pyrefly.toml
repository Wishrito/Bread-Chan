# Configuration Pyrefly
# Documentation : https://pyrefly.org/en/docs/configuration/

# Version de Python ciblée par le projet
python_version = "3.14"

# Plateforme cible (linux, darwin, windows)
python_platform = "linux"

# Dossiers/fichiers à analyser
project_includes = ["."]

# Dossiers/fichiers à exclure de l'analyse
project_excludes = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/build",
    "**/dist",
]

# Chemins de recherche pour la résolution des imports du projet
search_path = ["."]

# Chemin vers les packages installés dans le venv
# (à adapter selon le nom exact de ton venv, ici ".venv" par défaut)
site_package_path = [".venv/lib/python3.14/site-packages"]